<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="898" height="228" rx="14" fill="url(#bg)" stroke="#30363d"/>
  <rect x="1" y="1" width="898" height="228" rx="14" fill="url(#grid)"/>

  <!-- title bar -->
  <path d="M1 15a14 14 0 0 1 14-14h870a14 14 0 0 1 14 14v21H1z" fill="#1c2230"/>
  <circle cx="24" cy="19" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="19" r="6" fill="#febc2e"/>
  <circle cx="64" cy="19" r="6" fill="#28c840"/>
  <text x="450" y="24" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#8b949e">dj@dev: ~/dhananjay1906</text>

  <g font-family="JetBrains Mono, Consolas, Menlo, monospace">
    <text x="36" y="76" font-size="16" fill="#8b949e"><tspan fill="#34d399">➜</tspan> <tspan fill="#60a5fa">~</tspan> python -m dhananjay --full-stack</text>

    <text x="36" y="132" font-size="44" font-weight="700" fill="url(#name)">Dhananjay (DJ)
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.3s" fill="freeze"/>
    </text>

    <text x="38" y="168" font-size="16" fill="#c9d1d9" opacity="0">Full-Stack Engineer  ·  Python  ·  FastAPI  ·  React  ·  AI / LLM apps
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.9s" fill="freeze"/>
    </text>

    <text x="36" y="204" font-size="16" fill="#8b949e" opacity="0"><tspan fill="#34d399">✔</tspan> all tests passed  ·  0 failed  ·  open to work
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.5s" fill="freeze"/>
    </text>
    <rect x="522" y="190" width="10" height="18" fill="#a78bfa" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.5;0.51;1" dur="1s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
